name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Compile check
        run: python -m py_compile password_analyzer.py

      - name: Install linters
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check password_analyzer.py --output-format=github
        continue-on-error: true

      - name: Verify script imports
        run: python -c "import ast, pathlib; ast.parse(pathlib.Path('password_analyzer.py').read_text())"

      - name: Check file is executable
        run: |
          if [ -f password_analyzer.py ]; then
            echo "password_analyzer.py exists"
            wc -l password_analyzer.py
          fi